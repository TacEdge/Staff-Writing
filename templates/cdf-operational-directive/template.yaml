# CDF Operational Directive: DFI 5.1 3.2.15-3.2.19; template Annex 3E (Fig 3-6).
# No DFI example exists. Body composed by schema.py (scheme D numbering).
id: cdf-operational-directive
title: CDF Operational Directive
dfi:
  section: "3.2.16-3.2.18"
  template: "3E (Fig 3-6), PDF pp 173-174"
  example: "none"
page: { margins: standard, orientation: portrait, numbering: directive }   # 3.2.18(1); DR-01; V-05
numbering: directive                                       # scheme D, 3.2.18(6)
page_numbering: directive_from_page_1_if_multi_page         # 3.2.18(1)
identity: badge                                            # 3.2.18(2)
date: { style: abbreviated }                               # 1.2.10b Directives
blocks:
  - letterhead                                             # badge top left, address line top right (Fig 3-6)
  - date_line: { indent_cm: 0 }                            # DR-07; copy number is in the header (A-21, DR-10)
  - addressees: { distribution_mode: info }                # 3.2.18(3): COMJFNZ; For information / See distribution
  - directive_identifier: { word: OPERATIONAL DIRECTIVE }  # 3.2.18(4)
  - subject                                                # 3.2.18(5): OPERATION [NAME]
  - body: { numbering: directive }                         # composed (schema.py)
  - signature: { variant: admin }                          # 3.2.18(7)
  - annex_list                                             # 3.2.18(8)
  - enclosure_list
  - distribution
  - supporting_documents: { numbering: directive }         # fn 23
