# External letter: DFI 5.1 2.1.13-2.1.16, 2.1.18; template Annex 2J (Fig 2-11
# typewritten, Fig 2-12 handwritten); example Annex 2I (Fig 2-10).
id: external-letter
title: External letter
dfi:
  section: "2.1.13-2.1.16, 2.1.18"
  template: "2J (Figs 2-11, 2-12), PDF pp 87-88"
  example: "2I (Fig 2-10), PDF p 86"
page: { margins: standard, orientation: portrait }
numbering: none                                        # 2.1.3(4), 2.1.16(12)
page_numbering: unclassified_from_page_2               # 2.1.16(19)
identity: letter                                       # 2.1.16(3)
date: { style: full }                                  # 2.1.16(5)
blocks:
  - letterhead                                         # 2.1.16(3)-(4): device left, sender address right
  - from_line                                          # 2.1.16(4) optional
  - date_line: { indent_cm: 0.0 }                      # 2.1.16(5); no file reference (2.1.16(6))
  - recipient                                          # 2.1.16(7), 2.1.18(5)
  - salutation                                         # 2.1.18
  - subject                                            # discretionary (1.2.17(1))
  - body: { numbering: none }                          # 2.1.16(12); reference in opening paragraph (2.1.16(10))
  - signature: { variant: letter }                     # 2.1.18, 2.1.16(17)
  - enclosure_list                                     # 2.1.16(18)
