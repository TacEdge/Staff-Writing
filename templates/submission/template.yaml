# Submission: DFI 5.1 2.1.12 (a form of minute, 2.1.11 applies);
# template Annex 2F (Fig 2-6); example Annex 2E (Fig 2-5).
# Only what differs from the minute is specified here; the body structure
# (Purpose / Context / Financial and resource implications / Summary) is
# composed by schema.py into the shared body blocks.
id: submission
title: Submission
dfi:
  section: "2.1.12 (and 2.1.10-2.1.11)"
  template: "2F (Fig 2-6), PDF pp 76-77"
  example: "2E (Fig 2-5), PDF pp 74-75"
page: { margins: standard, orientation: portrait }
numbering: correspondence
page_numbering: unclassified_from_page_2
identity: none
date: { style: abbreviated }
lint: { max_main_pages: 4 }                                 # 2.1.12b(6) "ideally" -> warning only
blocks:
  - originator_descriptor                                   # 2.1.3(1)
  - identifier: { word: MINUTE }                            # 2.1.11(3); Fig 2-6
  - date_line: { indent_cm: 1.0 }                           # 2.1.11(2); A-06
  - addressees: { info_max: 6 }                             # 2.1.11(6): one addressee
  - subject                                                 # 2.1.11(8)
  - references                                              # 2.1.11(9)
  - body: { numbering: correspondence }                     # 2.1.12b(1)-(4), composed
  - signature: { variant: minute }                          # 2.1.12b(5)
  - telephone                                               # [T] Fig 2-6
  - annex_list
  - enclosure_list
  - copy_distribution
  - supporting_documents
