# CDF Directive: DFI 5.1 3.2.8-3.2.14; template Annex 3D (Fig 3-5). No DFI
# example exists. Commander (3.2.12) and senior-executive (3.2.13) directives
# are variants selected by `issuer` in the content (register DR-13).
id: cdf-directive
title: CDF Directive
dfi:
  section: "3.2.8-3.2.14"
  template: "3D (Fig 3-5), PDF pp 167-168"
  example: "none"
page: { margins: standard, orientation: portrait, numbering: directive }   # 3.2.11(1); DR-01; V-05
numbering: directive                                       # scheme D, 3.2.11(6)
page_numbering: directive_from_page_1_if_multi_page         # 3.2.11(1)
identity: badge                                            # 3.2.11(2), 3.2.12b, 3.2.13c (schema)
date: { style: abbreviated }                               # 1.2.10b Directives
blocks:
  - letterhead                                             # badge top left, address line top right (Fig 3-5; A-14)
  - date_line: { indent_cm: 0 }                            # DR-07
  - addressees: { distribution_mode: all }                 # 3.2.11(3); "See distribution" bold (Fig 3-5; DR-15)
  - directive_identifier: { word: DIRECTIVE }              # 3.2.11(4)
  - subject                                                # 3.2.11(5)
  - body: { numbering: directive }                         # composed (schema.py)
  - signature: { variant: admin }                          # 3.2.11(7); Fig 3-5 NAME / title-rank / appointment
  - annex_list                                             # 3.2.11(8)
  - enclosure_list
  - distribution
  - supporting_documents: { numbering: directive }         # fn 23
