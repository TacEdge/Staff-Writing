  planning_guidance:
    - "COS are to complete the first reconciliation by 30 Jun 26."
administration:
  finance:
    - "Costs are to be met from existing baselines."
  legal:
    - "Defence Legal Services has advised that there are no legal implications."
command_and_control:
  reporting:
    - "COS are to report reconciliation results to CFO each quarter."
  dirlauth:
    - "DIRLAUTH is granted between Service equipment accountants and the Finance Branch."
  points_of_contact:
    - "The point of contact is SO1 Finance Policy, DTelN (349) 7101."
cancellation:
  option: incorporated
  date: { year: 2027, month: 3, day: 31 }
signature: { initials: AB, surname: Example, rank: AM, appointment: Chief of Defence Force }
