    sub:
    - heading: Content
      text: The condition assessment found corrosion in three of the four tanks.
    - heading: Sections
      text: Background and options are covered below.
    - heading: Argument
      text: Replacement is cheaper over 20 years than continued repair.
    - heading: Implications
      text: Fuel will be trucked from Ohakea during the eight-week works period.
    - heading: Effects
      text: Training at Linton will not be affected.
    - heading: Consultation
      text: Land Component Command and Defence Estate and Infrastructure have been consulted and support the proposal.
