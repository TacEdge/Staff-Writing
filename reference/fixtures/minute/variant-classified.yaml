    subject: Exercise SOUTHERN KATIPO public affairs plan
    body:
      - group: Concept
      - para: "Public affairs activity will promote the exercise as an example of regional cooperation."
      - para: "Media access to exercise areas will be escorted at all times."
    appendices:
      - title: Media access schedule
        subject: Media access schedule
        body:
          - para: "Media days are scheduled for the second and fourth weeks of the exercise."
